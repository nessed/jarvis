[pytest]
markers =
    live: requires real local services or network (Ollama, Supabase, Meta). Excluded from the default run.
    realflp: requires the Python 3.11 sandbox (.venv311) and PyFLP against a real .flp. Excluded from the default run.
    guiauto: drives a real installed GUI app (Zoom, WhatsApp Desktop) via pywinauto. Gated on an explicit env var; never runs automatically. Excluded from the default run.
# -p no:cacheprovider: this repo's .pytest_cache is owned by another Windows
# account and cannot be written (same ownership fault as USER-TASKS U13), so
# every run warns or errors without it. It lived in CLAUDE.md and the
# pre-commit hook by hand until 2 Sep 2026; a flag that must be remembered is
# a flag that gets forgotten.
#
# --basetemp is deliberately NOT here. A fixed basetemp is emptied at session
# start, so parallel lanes delete each other's tmp_path dirs. conftest.py
# points PYTEST_DEBUG_TEMPROOT at a repo-local root instead, which keeps
# pytest's own concurrency-safe pytest-<n> numbering. See that file.
addopts = -m "not live and not realflp and not guiauto" -p no:cacheprovider
testpaths = tests
